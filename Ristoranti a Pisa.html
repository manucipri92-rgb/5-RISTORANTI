<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ristoranti a Pisa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1d1b; --muted:#76736b; --line:#e4e0d6;
  --accent:#c8472b; --accent-ink:#ffffff;
  --land:#ece6d6; --city:#f6f1e3; --water:#9cc7dc; --street:#ffffff; --green:#cfe0b8;
  --good:#2f8f4e; --mid:#d9921a; --bad:#c9402f;
  --sand:#eadfbf; --forest:#c5d8a8; --forest2:#9fbd80; --field:#e4e6c4; --field2:#dfe3b8; --bank:#7fb0c8; --block:#e3dbc6; --hwy:#f2b24d; --hwy2:#fff3d1; --rail:#8d8a80; --bldg:#e9c9a0; --plaza:#fff7e4; --hill:#d7d2ba; --hill2:#c6c4a3;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --card:#212328; --ink:#f0eee8; --muted:#9a978f; --line:#32343a;
    --accent:#e8694b; --accent-ink:#1a0c08;
    --land:#1f2125; --city:#272a2f; --water:#28485c; --street:#3b3e46; --green:#2b3a2a;
    --good:#4bb671; --mid:#e8a93a; --bad:#e8604f;
    --sand:#3a3626; --forest:#243424; --forest2:#2f4630; --field:#2a2d24; --field2:#2d3126; --bank:#1f3a4c; --block:#31343b; --hwy:#a5762a; --hwy2:#4a3a1b; --rail:#6d6a62; --bldg:#5a4a3a; --plaza:#3a3d44; --hill:#2c2d28; --hill2:#34352e;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a; --card:#212328; --ink:#f0eee8; --muted:#9a978f; --line:#32343a;
  --accent:#e8694b; --accent-ink:#1a0c08;
  --land:#1f2125; --city:#272a2f; --water:#28485c; --street:#3b3e46; --green:#2b3a2a;
  --good:#4bb671; --mid:#e8a93a; --bad:#e8604f;
    --sand:#3a3626; --forest:#243424; --forest2:#2f4630; --field:#2a2d24; --field2:#2d3126; --bank:#1f3a4c; --block:#31343b; --hwy:#a5762a; --hwy2:#4a3a1b; --rail:#6d6a62; --bldg:#5a4a3a; --plaza:#3a3d44; --hill:#2c2d28; --hill2:#34352e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{padding:12px 18px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);background:var(--bg)}
h1{font-family:var(--serif);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px}
main{flex:1;position:relative;min-height:0}
.page{position:absolute;inset:0}
.hidden{display:none!important}

/* MAP */
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--land);cursor:grab}
#map text{font-family:var(--sans)}
.lbl{fill:var(--muted);font-weight:600;paint-order:stroke;stroke:var(--city);stroke-linejoin:round}
.lbl.it{font-style:italic;font-weight:500}
.pin{cursor:pointer}
.pv{fill:#fff;font-weight:800;font-family:var(--sans)}
.pn{fill:#1d1d1b;font-weight:800;paint-order:stroke;stroke:#fff;stroke-linejoin:round}
.ctl{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px}
.cbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer;font-family:var(--sans)}
#north{position:absolute;left:12px;top:12px;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:800;line-height:1;gap:1px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12);pointer-events:none}
#north span{font-size:9px;color:var(--accent)}
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:14px 22px;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;font-family:var(--sans)}
#banner{position:absolute;left:12px;right:12px;top:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#banner button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;padding:6px 10px;font-size:13.5px;cursor:pointer;font-family:var(--sans)}

/* LIST */
#pgList{overflow:auto;padding:14px 14px 22px}
.row-r{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.pos{font-family:var(--serif);font-weight:800;font-size:20px;width:30px;text-align:center;color:var(--muted)}
.rinfo{flex:1;min-width:0}
.rname{font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{color:var(--muted);font-size:12.5px;margin-top:3px}
.badge{min-width:54px;text-align:center;border-radius:14px;color:#fff;font-weight:800;font-size:19px;padding:9px 8px;font-family:var(--serif)}
.empty{text-align:center;color:var(--muted);padding:60px 24px;line-height:1.5}
.empty b{color:var(--ink);display:block;font-family:var(--serif);font-size:20px;margin-bottom:6px}

/* NAV */
nav{display:flex;border-top:1px solid var(--line);background:var(--bg)}
nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 0 8px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:var(--sans)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}

/* SHEET */
#sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(0,0,0,.42)}
#sheet.open{display:flex}
#sheetBody{width:100%;max-width:640px;margin:0 auto;max-height:90%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sh-head h2{font-family:var(--serif);font-size:22px;margin:0}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.fld{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:12px}
.fld input,.fld select{display:block;width:100%;margin-top:5px;font-size:17px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--sans)}
.fld input.err{border-color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sl{margin:4px 0 12px}
.sl .t{display:flex;justify-content:space-between;font-weight:600;font-size:14.5px}
.sl output{font-family:var(--serif);font-weight:800;font-size:18px}
.sl input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 0}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:13px;cursor:pointer;font-family:var(--sans)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.small{flex:0 0 auto;font-size:13.5px;padding:8px 12px;border-radius:10px}
.hero{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:6px}
.hero .big{font-family:var(--serif);font-weight:800;font-size:38px;line-height:1;min-width:76px;text-align:center;border-radius:16px;color:#fff;padding:14px 6px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;flex:1;font-size:13.5px}
.chips span{display:flex;justify-content:space-between;gap:6px;color:var(--muted)}
.chips b{color:var(--ink)}
.vote{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.vote .vh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.vote .who{font-weight:800;font-size:16.5px}
.vote .dt{color:var(--muted);font-size:13px}
.vote .vals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0;text-align:center}
.vote .vals div{background:var(--bg);border-radius:10px;padding:7px 2px;font-size:11.5px;color:var(--muted)}
.vote .vals b{display:block;font-family:var(--serif);font-size:18px;color:var(--ink)}
.vote .va{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vote .va .m{font-weight:700;font-size:14px}
.vote .va .bs{display:flex;gap:8px}
</style>
</head>

<div id="sheet"><div id="sheetBody"></div></div>

<script>
(function(){
"use strict";
var AMICI=["Cipri","Marti","Bene","Mati","Cardu"];
var CRIT=[["location","Location"],["menu","Menù"],["servizio","Servizio"],["prezzo","Prezzo"]];
var LAND=[];
var KEY="ristoranti-pisa-v1";
var state={ristoranti:[],v:2};
var IW=1230,IH=1102,MINW=150,MAXW=2600;
var view={cx:IW/2,cy:IH/2,w:IW};
var pending=null;      // {type:"new"} | {type:"move",id}
var sheet=null;        // {mode:"new",x,y} | {mode:"detail",id,edit,confirm}
var dbDoc=null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtDate(s){try{return new Date(s+"T12:00:00").toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"})}catch(e){return s}}
function fmt(n){return n==null?"–":(Math.round(n*10)/10).toFixed(1).replace(".",",")}
function colorOf(n){return n==null?"var(--muted)":n>=7?"var(--good)":n>=5?"var(--mid)":"var(--bad)"}
function avgV(v){return (v.location+v.menu+v.servizio+v.prezzo)/4}
function avgR(r){return r.voti.length?r.voti.reduce(function(s,v){return s+avgV(v)},0)/r.voti.length:null}
function avgC(r,k){return r.voti.length?r.voti.reduce(function(s,v){return s+v[k]},0)/r.voti.length:null}
function getR(id){return state.ristoranti.find(function(r){return r.id===id})}

function buildBase(){}

/* ---------- persistenza ---------- */
function migrate(o){
  if(o.v!==2){o.ristoranti.forEach(function(r,i){r.x=IW/2-80+(i%5)*40;r.y=IH/2+Math.floor(i/5)*50});o.v=2}
  return o;
}
function loadLocal(){
  try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&Array.isArray(o.ristoranti))state=migrate(o)}}catch(e){}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(dbDoc){try{dbDoc.set({json:JSON.stringify(state)}).catch(function(){})}catch(e){}}
}
function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    window.claude.use("db").then(function(db){
      if(!db)return;
      var d=db.doc("ristoranti/dati");
      return d.get().then(function(snap){
        dbDoc=d;
        if(snap.exists){
          var o=JSON.parse(snap.data().json);
          if(o&&Array.isArray(o.ristoranti)){state=migrate(o);save();renderAll()}
        }else if(state.ristoranti.length){save()}
        $("sub").textContent="Mappa di Pisa · sincronizzata";
      });
    }).catch(function(){dbDoc=null});
  }catch(e){dbDoc=null}
}

/* ---------- mappa ---------- */
var svg=$("map");
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function applyView(){
  var W=svg.clientWidth||1,H=svg.clientHeight||1;
  view.w=clamp(view.w,MINW,MAXW);
  view.cx=clamp(view.cx,0,IW);view.cy=clamp(view.cy,0,IH);
  var h=view.w*H/W;
  svg.setAttribute("viewBox",(view.cx-view.w/2)+" "+(view.cy-h/2)+" "+view.w+" "+h);
  drawOverlay();
}
function drawOverlay(){
  var W=svg.clientWidth||1,k=view.w/W,i,l="",p="";
  for(i=0;i<LAND.length;i++){
    var a=LAND[i];
    if(a[4]&&view.w>a[4])continue;
    var fs=(a[5]||12)*k;
    l+='<text x="'+a[0]+'" y="'+a[1]+'" text-anchor="middle" class="lbl'+(a[3]?' it':'')+'" style="font-size:'+fs+'px;stroke-width:'+(3.5*k)+'px">'+esc(a[2])+'</text>';
  }
  $("lbl").innerHTML=l;
  state.ristoranti.forEach(function(r){
    var av=avgR(r),c=colorOf(av),x=r.x,y=r.y;
    p+='<g class="pin" data-id="'+r.id+'">'+
      '<polygon points="'+x+','+y+' '+(x-8*k)+','+(y-17*k)+' '+(x+8*k)+','+(y-17*k)+'" style="fill:'+c+'"/>'+
      '<circle cx="'+x+'" cy="'+(y-28*k)+'" r="'+(19*k)+'" style="fill:'+c+';stroke:#fff;stroke-width:'+(2.5*k)+'px"/>'+
      '<text x="'+x+'" y="'+(y-28*k+5*k)+'" text-anchor="middle" class="pv" style="font-size:'+(14*k)+'px">'+fmt(av)+'</text>'+
      '<text x="'+x+'" y="'+(y+15*k)+'" text-anchor="middle" class="pn" style="font-size:'+(11.5*k)+'px;stroke-width:'+(3.5*k)+'px">'+esc(r.nome)+'</text></g>';
  });
  if(sheet&&sheet.mode==="new"){
    p+='<g><polygon points="'+sheet.x+','+sheet.y+' '+(sheet.x-8*k)+','+(sheet.y-17*k)+' '+(sheet.x+8*k)+','+(sheet.y-17*k)+'" style="fill:var(--accent)"/>'+
       '<circle cx="'+sheet.x+'" cy="'+(sheet.y-28*k)+'" r="'+(19*k)+'" style="fill:var(--accent);stroke:#fff;stroke-width:'+(2.5*k)+'px;stroke-dasharray:'+(5*k)+' '+(3*k)+'"/>'+
       '<text x="'+sheet.x+'" y="'+(sheet.y-28*k+7*k)+'" text-anchor="middle" class="pv" style="font-size:'+(22*k)+'px">+</text></g>';
  }
  $("pins").innerHTML=p;
}
function toSvg(e){
  var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
var ptrs=new Map(),moved=0,pinch0=null;
function mid(){var a=Array.from(ptrs.values());return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1}}
function anchorAt(mx,my){var r=svg.getBoundingClientRect(),W=r.width||1,H=r.height||1,h=view.w*H/W;return {x:view.cx-view.w/2+(mx-r.left)/W*view.w,y:view.cy-h/2+(my-r.top)/H*h}}
function placeAnchor(a,mx,my){var r=svg.getBoundingClientRect(),W=r.width||1,H=r.height||1,h=view.w*H/W;view.cx=a.x+view.w/2-(mx-r.left)/W*view.w;view.cy=a.y+h/2-(my-r.top)/H*h}
svg.addEventListener("pointerdown",function(e){
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)moved=0;
  if(ptrs.size===2){var m=mid();pinch0={d:m.d,w:view.w,a:anchorAt(m.x,m.y)};moved=99}
});
svg.addEventListener("pointermove",function(e){
  var p=ptrs.get(e.pointerId);if(!p)return;
  var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){
    moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>6){var k=view.w/(svg.clientWidth||1);view.cx-=dx*k;view.cy-=dy*k;applyView()}
  }else if(ptrs.size===2&&pinch0){
    var m=mid();view.w=clamp(pinch0.w*pinch0.d/m.d,MINW,MAXW);placeAnchor(pinch0.a,m.x,m.y);applyView();
  }
});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null}
svg.addEventListener("pointerup",endPtr);
svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("gesturestart",function(e){e.preventDefault()});
svg.addEventListener("wheel",function(e){e.preventDefault();var a=anchorAt(e.clientX,e.clientY);view.w=clamp(view.w*(e.deltaY>0?1.12:0.89),MINW,MAXW);placeAnchor(a,e.clientX,e.clientY);applyView()},{passive:false});
svg.addEventListener("click",function(e){
  if(moved>8)return;
  if(pending){
    var pt=toSvg(e);
    var x=Math.round(pt.x*10)/10,y=Math.round(pt.y*10)/10;
    if(pending.type==="new"){pending=null;updateBanner();openSheet({mode:"new",x:x,y:y})}
    else{
      var r=getR(pending.id);var id=pending.id;pending=null;updateBanner();
      if(r){r.x=x;r.y=y;save()}
      openSheet({mode:"detail",id:id,edit:null,confirm:null});renderAll();
    }
    return;
  }
  var g=e.target.closest&&e.target.closest(".pin");
  if(g)openSheet({mode:"detail",id:g.getAttribute("data-id"),edit:null,confirm:null});
});
$("zin").onclick=function(){view.w*=0.7;applyView()};
$("zout").onclick=function(){view.w*=1.4;applyView()};
function updateBanner(){
  var b=$("banner");
  if(!pending){b.classList.add("hidden");$("fab").classList.remove("hidden");$("ctl").style.top="12px";return}
  $("bannerTxt").textContent=pending.type==="new"?"Tocca la mappa dove si trova il ristorante":"Tocca la nuova posizione";
  b.classList.remove("hidden");$("fab").classList.add("hidden");$("ctl").style.top="76px";
}
$("fab").onclick=function(){pending={type:"new"};updateBanner()};
$("bannerX").onclick=function(){
  var wasMove=pending&&pending.type==="move"?pending.id:null;
  pending=null;updateBanner();
  if(wasMove)openSheet({mode:"detail",id:wasMove,edit:null,confirm:null});
};
window.addEventListener("resize",applyView);
if(window.ResizeObserver)new ResizeObserver(applyView).observe(svg);

/* ---------- classifica ---------- */
function renderList(){
  var el=$("pgList");
  if(!state.ristoranti.length){
    el.innerHTML='<div class="empty"><b>Ancora nessun ristorante</b>Vai sulla mappa e tocca “Aggiungi ristorante” per inserire il primo.</div>';return;
  }
  var rs=state.ristoranti.slice().sort(function(a,b){
    var x=avgR(a),y=avgR(b);
    if(x==null&&y==null)return a.nome.localeCompare(b.nome);
    if(x==null)return 1;if(y==null)return -1;return y-x;
  });
  var medals=["🥇","🥈","🥉"];
  el.innerHTML=rs.map(function(r,i){
    var av=avgR(r);
    var meta=r.voti.length?r.voti.length+(r.voti.length===1?" voto":" voti")+" · L "+fmt(avgC(r,"location"))+" · M "+fmt(avgC(r,"menu"))+" · S "+fmt(avgC(r,"servizio"))+" · P "+fmt(avgC(r,"prezzo")):"Nessun voto";
    return '<div class="row-r" data-id="'+r.id+'"><div class="pos">'+(av!=null&&i<3?medals[i]:(i+1))+'</div><div class="rinfo"><div class="rname">'+esc(r.nome)+'</div><div class="rmeta">'+meta+'</div></div><div class="badge" style="background:'+colorOf(av)+'">'+fmt(av)+'</div></div>';
  }).join("");
}
$("pgList").addEventListener("click",function(e){
  var row=e.target.closest(".row-r");
  if(row)openSheet({mode:"detail",id:row.getAttribute("data-id"),edit:null,confirm:null});
});
function showTab(t){
  var map=t==="map";
  $("pgMap").classList.toggle("hidden",!map);$("pgList").classList.toggle("hidden",map);
  $("tMap").classList.toggle("on",map);$("tList").classList.toggle("on",!map);
  if(map)applyView();else renderList();
}
$("tMap").onclick=function(){showTab("map")};
$("tList").onclick=function(){showTab("list")};

/* ---------- scheda ---------- */
function fields(v){
  var opts=AMICI.map(function(n){return '<option'+(n===v.chi?' selected':'')+'>'+n+'</option>'}).join("");
  var sl=CRIT.map(function(c){
    return '<div class="sl"><div class="t"><span>'+c[1]+'</span><output>'+fmt(v[c[0]])+'</output></div><input type="range" min="0" max="10" step="0.5" value="'+v[c[0]]+'" data-k="'+c[0]+'"></div>';
  }).join("");
  return '<div class="two"><label class="fld">Chi vota<select id="fchi">'+opts+'</select></label><label class="fld">Data<input type="date" id="fdata" value="'+esc(v.data)+'"></label></div>'+sl;
}
function readFields(){
  var v={chi:$("fchi").value,data:$("fdata").value||today()};
  document.querySelectorAll("#sheetBody input[type=range]").forEach(function(i){v[i.getAttribute("data-k")]=parseFloat(i.value)});
  return v;
}
function defVoto(){return {chi:AMICI[0],data:today(),location:7,menu:7,servizio:7,prezzo:7}}
function openSheet(s){sheet=s;renderSheet();drawOverlay()}
function closeSheet(){sheet=null;renderSheet();drawOverlay()}
function renderSheet(){
  var el=$("sheet"),b=$("sheetBody");
  if(!sheet){el.classList.remove("open");return}
  el.classList.add("open");
  if(sheet.mode==="new"){
    b.innerHTML='<div class="sh-head"><h2>Nuovo ristorante</h2><button class="x" data-act="close" aria-label="Chiudi">✕</button></div>'+
      '<label class="fld">Nome del ristorante<input id="fname" maxlength="60" placeholder="Es. Trattoria da Mario" autocomplete="off"></label>'+
      '<h3>Primo voto</h3>'+fields(defVoto())+
      '<div class="btns"><button class="btn ghost" data-act="close">Annulla</button><button class="btn" data-act="saveNew">Salva ristorante</button></div>';
    return;
  }
  var r=getR(sheet.id);
  if(!r){sheet=null;el.classList.remove("open");return}
  var av=avgR(r);
  var h='<div class="sh-head"><h2>Dettaglio</h2><button class="x" data-act="close" aria-label="Chiudi">✕</button></div>'+
    '<label class="fld">Nome<input id="rname" maxlength="60" value="'+esc(r.nome)+'"></label>'+
    '<div class="hero"><div class="big" style="background:'+colorOf(av)+'">'+fmt(av)+'</div><div class="chips">'+
    CRIT.map(function(c){return '<span>'+c[1]+' <b>'+fmt(avgC(r,c[0]))+'</b></span>'}).join("")+
    '</div></div>';
  h+='<h3>Voti ('+r.voti.length+')</h3>';
  var vs=r.voti.slice().sort(function(a,b){return a.data<b.data?1:a.data>b.data?-1:0});
  vs.forEach(function(v){
    if(sheet.edit===v.id){
      h+='<div class="vote">'+fields(v)+'<div class="btns"><button class="btn ghost" data-act="cancelEdit">Annulla</button><button class="btn" data-act="saveVote">Salva</button></div></div>';
    }else{
      var cv=sheet.confirm==="v"+v.id;
      h+='<div class="vote"><div class="vh"><span class="who">'+esc(v.chi)+'</span><span class="dt">'+fmtDate(v.data)+'</span></div>'+
        '<div class="vals">'+CRIT.map(function(c){return '<div>'+c[1]+'<b>'+fmt(v[c[0]])+'</b></div>'}).join("")+'</div>'+
        '<div class="va"><span class="m" style="color:'+colorOf(avgV(v))+'">Media '+fmt(avgV(v))+'</span><span class="bs">'+
        '<button class="btn small ghost" data-act="editVote" data-id="'+v.id+'">Modifica</button>'+
        '<button class="btn small danger" data-act="delVote" data-id="'+v.id+'">'+(cv?"Sicuro?":"Elimina")+'</button></span></div></div>';
    }
  });
  if(sheet.edit==="new"){
    h+='<div class="vote">'+fields(defVoto())+'<div class="btns"><button class="btn ghost" data-act="cancelEdit">Annulla</button><button class="btn" data-act="saveVote">Aggiungi voto</button></div></div>';
  }else if(!sheet.edit){
    h+='<div class="btns"><button class="btn" data-act="addVote">+ Aggiungi voto</button></div>';
  }
  h+='<div class="btns" style="margin-top:22px"><button class="btn ghost" data-act="move">Sposta sulla mappa</button>'+
     '<button class="btn danger" data-act="delRest">'+(sheet.confirm==="r"?"Sicuro? Tocca ancora":"Elimina ristorante")+'</button></div>';
  b.innerHTML=h;
}
$("sheet").addEventListener("click",function(e){if(e.target===$("sheet"))closeSheet()});
$("sheetBody").addEventListener("input",function(e){
  var t=e.target;
  if(t.type==="range"){var o=t.parentNode.querySelector("output");if(o)o.textContent=fmt(parseFloat(t.value))}
  if(t.id==="fname")t.classList.remove("err");
});
$("sheetBody").addEventListener("change",function(e){
  if(e.target.id==="rname"&&sheet&&sheet.mode==="detail"){
    var r=getR(sheet.id),n=e.target.value.trim();
    if(r&&n){r.nome=n;save();renderList();drawOverlay()}
  }
});
$("sheetBody").addEventListener("click",function(e){
  var bt=e.target.closest("[data-act]");if(!bt)return;
  var act=bt.getAttribute("data-act"),id=bt.getAttribute("data-id"),r;
  if(act==="close"){closeSheet();return}
  if(act==="saveNew"){
    var inp=$("fname"),n=inp.value.trim();
    if(!n){inp.classList.add("err");inp.focus();return}
    var v=readFields();v.id=uid();
    var nr={id:uid(),nome:n,x:sheet.x,y:sheet.y,voti:[v]};
    state.ristoranti.push(nr);save();
    sheet={mode:"detail",id:nr.id,edit:null,confirm:null};
    renderAll();return;
  }
  r=sheet&&sheet.mode==="detail"?getR(sheet.id):null;if(!r)return;
  if(act==="addVote"){sheet.edit="new";sheet.confirm=null;renderSheet()}
  else if(act==="editVote"){sheet.edit=id;sheet.confirm=null;renderSheet()}
  else if(act==="cancelEdit"){sheet.edit=null;renderSheet()}
  else if(act==="saveVote"){
    var nv=readFields();
    if(sheet.edit==="new"){nv.id=uid();r.voti.push(nv)}
    else{var i=r.voti.findIndex(function(x){return x.id===sheet.edit});if(i>=0){nv.id=r.voti[i].id;r.voti[i]=nv}}
    sheet.edit=null;save();renderAll();
  }
  else if(act==="delVote"){
    if(sheet.confirm==="v"+id){r.voti=r.voti.filter(function(x){return x.id!==id});sheet.confirm=null;save();renderAll()}
    else{sheet.confirm="v"+id;renderSheet()}
  }
  else if(act==="delRest"){
    if(sheet.confirm==="r"){state.ristoranti=state.ristoranti.filter(function(x){return x.id!==r.id});save();sheet=null;renderAll()}
    else{sheet.confirm="r";renderSheet()}
  }
  else if(act==="move"){
    pending={type:"move",id:r.id};sheet=null;showTab("map");renderSheet();updateBanner();drawOverlay();
  }
});
function renderAll(){drawOverlay();renderSheet();if(!$("pgList").classList.contains("hidden"))renderList()}

buildBase();
loadLocal();
view.w=Math.max(IW,IH*(svg.clientWidth||1)/(svg.clientHeight||1));
applyView();
renderList();
initDb();
})();
</script>
</body>
</html>
